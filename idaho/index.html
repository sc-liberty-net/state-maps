}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--sea);color:var(--ink);-webkit-font-smoothing:antialiased;
  font:14px/1.45 var(--font-ui)}
::selection{background:var(--accent);color:var(--on-accent)}
button,input{font:inherit;color:inherit}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

#stage{position:fixed;inset:0;touch-action:none}
#map,#cv{position:absolute;inset:0;display:block;width:100%;height:100%}
#map{cursor:grab;outline:none}
#cv{display:none;pointer-events:none}
#map.panning{cursor:grabbing}
.land{fill:var(--land)}
.outline{fill:none;stroke:var(--ink);stroke-width:1.3;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.lay path{vector-effect:non-scaling-stroke;stroke-linejoin:round;fill-rule:evenodd}
.lay.dist path{fill-opacity:var(--fill-op);stroke:var(--land);stroke-width:1.5}
.lay.cty path{fill:var(--cty-fill);stroke:var(--county-line);stroke-width:.8}
.lay.pct path{fill:var(--land);stroke:var(--hair);stroke-width:.6}
.lay.live path{cursor:pointer}
.lay.live path:hover{fill-opacity:calc(var(--fill-op) + .2)}
.lay.cty.live path:hover,.lay.pct.live path:hover{fill:var(--panel-2)}
.ctx{fill:none;stroke:var(--county-line);stroke-width:.7;stroke-dasharray:3 2.5;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.85}
.ctx.solid{stroke-dasharray:none;stroke-width:1.1;stroke:var(--ink-2)}
.selmark{fill:none;stroke:var(--sel);stroke-width:3;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.selmark.under{stroke:var(--land);stroke-width:6}
.hovmark{fill:none;stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke;pointer-events:none}
.lbl{fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-weight:600;
  paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;pointer-events:none;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.lbl.n{font-weight:700}
.lay path:focus{outline:none}
/* ---------- chrome ---------- */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow)}
#side{position:fixed;left:16px;top:16px;width:280px;max-height:calc(100% - 32px);display:flex;flex-direction:column;z-index:3}
.brand{padding:16px 18px 12px}
.brand h1{font:400 34px/1 var(--font-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--ink-2);font-size:13px}
#layers{border:0;margin:0;padding:4px 8px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
#layers legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lyr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;position:relative;
  transition:background-color .15s ease-out}
.lyr:hover{background:var(--panel-2)}
.lyr input{position:absolute;opacity:0;pointer-events:none}
.lyr::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink-3);flex:none;transition:border-width .15s ease-out,border-color .15s}
.lyr:has(input:checked){background:var(--panel-2)}
.lyr:has(input:checked)::before{border:4.5px solid var(--accent)}
.lyr:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:-2px}
.lyr-name{flex:1;font-weight:500}
.lyr-n{color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.lyr:has(input:checked) .lyr-n{color:var(--ink-2)}
.searchbox{position:relative;margin:4px 12px 14px;border-top:1px solid var(--rule);padding-top:12px}
.searchbox .ic{position:absolute;left:10px;top:21px;color:var(--ink-3);pointer-events:none}
#q{width:100%;border:1px solid var(--rule);background:var(--land);border-radius:8px;padding:8px 10px 8px 34px;outline:none}
#q::placeholder{color:var(--ink-3)}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
#results{list-style:none;margin:6px 0 0;padding:0;max-height:260px;overflow:auto;display:none}
#results.on{display:block}
#results li{display:flex;gap:8px;align-items:baseline;padding:7px 10px;border-radius:7px;cursor:pointer}
#results li[aria-selected="true"],#results li:hover{background:var(--panel-2)}
#results .k{color:var(--ink-3);font-size:12px;margin-left:auto;white-space:nowrap}
#results .empty{color:var(--ink-3);cursor:default}

#tools{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:3;
  transition:right .26s cubic-bezier(.16,1,.3,1)}
body.sheet #tools{right:352px}   /* a tall inspector reaches the bottom: the tools step aside */
.btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--rule);background:var(--panel);
  border-radius:10px;cursor:pointer;box-shadow:var(--shadow);transition:background-color .15s ease-out}
.btn:hover{background:var(--panel-2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,#pclose:focus-visible,.xchip:focus-visible,#srcbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn[data-mode="light"] .ic path{fill:none}

#tip{position:fixed;pointer-events:none;z-index:6;background:var(--panel);border:1px solid var(--rule);border-radius:8px;
  padding:6px 10px;font-size:13px;box-shadow:var(--shadow);display:none;max-width:280px}
#tip b{font-weight:600}
#tip .t2{color:var(--ink-2);font-size:12px}

#panel{position:fixed;right:16px;top:16px;width:320px;max-height:calc(100% - 32px);overflow:auto;z-index:4;
  padding:18px 20px 20px;transform:translateX(calc(100% + 24px));opacity:0;
  transition:transform .26s cubic-bezier(.16,1,.3,1),opacity .2s ease-out;visibility:hidden}
#panel.on{transform:none;opacity:1;visibility:visible}
#pclose{position:absolute;right:10px;top:10px;width:32px;height:32px;border:0;background:none;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
#pclose:hover{background:var(--panel-2)}
#psub{margin:-10px 36px 16px 0;color:var(--ink-2);font-size:13px}
#psub:empty{display:none}
#pname{margin:2px 36px 16px 0;font:400 28px/1.05 var(--font-display);text-wrap:balance}
#pfacts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:13.5px}
#pfacts dt{color:var(--ink-2)}
#pfacts dd{margin:0;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.xchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--land);border-radius:999px;
  padding:2px 10px 2px 7px;font-size:12.5px;cursor:pointer;line-height:1.5}
.xchip:hover{border-color:var(--ink-3)}
.xchip .sw{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid color-mix(in srgb,var(--ink) 18%,transparent)}
.more{border:0;background:none;color:var(--accent);padding:2px 4px;cursor:pointer;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}

#foot{position:fixed;left:16px;bottom:16px;z-index:2;display:flex;gap:8px;align-items:flex-end}
#srcbtn{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:6px 12px 6px 9px;display:flex;gap:6px;align-items:center;
  cursor:pointer;color:var(--ink-2);font-size:12.5px;box-shadow:var(--shadow)}
#srcbtn .ic{width:16px;height:16px}
#sources{position:fixed;left:16px;bottom:60px;width:min(420px,calc(100% - 32px));padding:16px 18px;z-index:5;display:none;font-size:13px}
#sources.on{display:block}
#sources h2{font:400 22px/1.1 var(--font-display);margin:0 0 10px}
#sources dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
#sources dt{font-weight:600}
#sources dd{margin:0;color:var(--ink-2)}
#sources p{color:var(--ink-2);margin:12px 0 0}
#sources .warn{color:var(--ink)}
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:2;color:var(--ink-3);font-size:12px;pointer-events:none;transition:opacity .4s}

@media (max-width:760px){
  #side{left:10px;right:10px;top:10px;width:auto;max-height:none}
  .brand{padding:12px 14px 6px;display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:26px}
  .brand p{margin:0;font-size:12px}
  #layers{flex-direction:row;overflow-x:auto;padding:4px 8px 8px;scrollbar-width:none;gap:4px}
  #layers::-webkit-scrollbar{display:none}
  .lyr{flex:none;padding:6px 10px;border:1px solid var(--rule)}
  .lyr::before{display:none}
  .lyr:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .lyr:has(input:checked) .lyr-n{color:var(--on-accent);opacity:.8}
  .searchbox{margin:0 10px 10px;padding-top:0;border:0}
  .searchbox .ic{top:9px}
  #q{font-size:16px;padding:7px 10px 7px 34px}
  #results{max-height:40vh}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:52vh;border-radius:14px 14px 0 0;
    transform:translateY(105%);padding:16px 18px calc(18px + env(safe-area-inset-bottom))}
  #pname{font-size:24px}
  #tools{right:10px;bottom:calc(14px + env(safe-area-inset-bottom))}
  body.sheet #tools,body.sheet #foot{opacity:0;pointer-events:none}
  body.sheet #tools{right:10px}
  #foot{left:10px;bottom:calc(14px + env(safe-area-inset-bottom))}
  #sources{left:10px;bottom:62px}
  #hint{display:none}
  #tip{display:none!important}
}

<script>
(()=>{
'use strict';
const H=JSON.parse(document.getElementById('HEAD').textContent);
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const svg=$('map'),cam=$('cam'),geo=$('geo'),labG=$('labels'),tip=$('tip'),panel=$('panel');
const META={};H.layers.forEach(l=>META[l.key]=l);
const DIST={cd:1,sldu:1,sldl:1};
const S={layer:null,sel:null,k:1,tx:0,ty:0,fitK:1,vw:0,vh:0,theme:'light'};
const L={};                       /* parsed layers: {items, g (svg group), byId} */
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
function load(key){
  if(L[key])return L[key];
  const J=JSON.parse($('L-'+key).textContent),items=J.items,byId=new Map();
  /* shared-border topology: arcs are [x0,y0,dx,dy,...] on the q grid; a ring lists arc
     indices, ~j meaning arc j walked backwards. Rebuilt into relative path strings. */
  const A=J.arcs.map(f=>{const p=[f[0],f[1]];let x=f[0],y=f[1];
    for(let i=2;i<f.length;i+=2){x+=f[i];y+=f[i+1];p.push(x,y);}return p;});
  const ringD=ring=>{const xs=[],ys=[];
    for(const j of ring){const a=A[j<0?~j:j],n=a.length/2;
      for(let t=xs.length?1:0;t<n;t++){const u=j<0?n-1-t:t;xs.push(a[2*u]);ys.push(a[2*u+1]);}}
    let m=xs.length;if(m>1&&xs[0]===xs[m-1]&&ys[0]===ys[m-1])m--;
    let s='M'+xs[0]+' '+ys[0]+'l';
    for(let i=1;i<m;i++){const dx=xs[i]-xs[i-1],dy=ys[i]-ys[i-1];s+=(i>1&&dx>=0?' ':'')+dx+(dy<0?'':' ')+dy;}
    return s+'z';};
  const lazy=key==='precinct';   /* canvas-drawn: a path string is only needed for marks */
  items.forEach((it,i)=>{it.i=i;it.layer=key;if(it.short==null)it.short=it.label;
    if(lazy){let d=null;Object.defineProperty(it,'d',{get(){return d||(d=it.r.map(ringD).join(''));}});}
    else{it.d=it.r.map(ringD).join('');delete it.r;}
    byId.set(it.id,it);});
  L[key]={items,byId,g:null,ctx:null,A,F:J.arcs};return L[key];
}
function build(key){
  const o=load(key);if(o.g)return o;
  const cls=key==='county'?'cty':key==='precinct'?'pct':'dist';
  const g=el('g',{class:'lay '+cls,transform:'scale('+H.q+')'});
  const frag=document.createDocumentFragment();
  for(const it of o.items){
    const p=el('path',{d:it.d});p.dataset.i=it.i;
    if(it.col!=null)p.setAttribute('fill','var(--c'+it.col+')');
    frag.appendChild(p);
  }
  g.appendChild(frag);g.style.display='none';
  geo.insertBefore(g,geo.firstChild);o.g=g;return o;
}
function ctxLines(){ /* county outlines over district & precinct fills, built once */
  const o=load('county');if(o.ctx)return o.ctx;
  const g=el('g',{transform:'scale('+H.q+')'});
  g.appendChild(el('path',{class:'ctx',d:o.items.map(i=>i.d).join('')}));
  geo.appendChild(g);o.ctx=g;return g;
}
$('land').setAttribute('d',H.state);$('oline').setAttribute('d',H.state);

/* ---------- precincts on canvas (O1) ----------
   Thousands of SVG paths re-rasterise on every camera frame. Precincts are drawn on a
   canvas instead: each shared border stroked once from the arcs, rendered crisp into an
   offscreen bitmap with a margin, and while the camera moves that bitmap is only
   re-positioned. A crisp render follows when the camera settles. Hit-testing uses a
   build-time-bbox grid plus an even-odd test on the shape's own rings. */
const cv=$('cv'),cvx=cv.getContext('2d');let PC=null;
function arcPath(F){let s='';for(const f of F){if(f.length<4)continue;s+='M'+f[0]+' '+f[1]+'l';
  for(let i=2;i<f.length;i+=2)s+=(i>2&&f[i]>=0?' ':'')+f[i]+(f[i+1]<0?'':' ')+f[i+1];}return new Path2D(s);}
function prepCanvas(){
  if(PC)return PC;const o=load('precinct');
  const cs=Math.max(H.w,H.h)/96,cols=Math.ceil(H.w/cs)+1,rows=Math.ceil(H.h/cs)+1,cells=Array.from({length:cols*rows},()=>[]);
  o.items.forEach((it,i)=>{const b=it.bbox;
    for(let r=Math.max(0,Math.floor(b[1]/cs));r<=Math.min(rows-1,Math.floor(b[3]/cs));r++)
      for(let c=Math.max(0,Math.floor(b[0]/cs));c<=Math.min(cols-1,Math.floor(b[2]/cs));c++)cells[r*cols+c].push(i);});
  /* borders bucketed into tiles, so a zoomed-in render strokes only what can be seen */
  const T=16,tw=H.w/T,th=H.h/T,buck=new Map(),q=H.q;
  for(const f of o.F){if(f.length<4)continue;let x=f[0],y=f[1],x0=x,x1=x,y0=y,y1=y;
    for(let i=2;i<f.length;i+=2){x+=f[i];y+=f[i+1];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
    const key=Math.min(T-1,Math.floor((x0+x1)/2*q/tw))+T*Math.min(T-1,Math.floor((y0+y1)/2*q/th));
    let b=buck.get(key);if(!b)buck.set(key,b={F:[],bb:[1e9,1e9,-1e9,-1e9]});b.F.push(f);
    b.bb=[Math.min(b.bb[0],x0*q),Math.min(b.bb[1],y0*q),Math.max(b.bb[2],x1*q),Math.max(b.bb[3],y1*q)];}
  const tiles=[...buck.values()].map(b=>({p:arcPath(b.F),bb:b.bb}));
  PC={tiles,cty:META.county?arcPath(load('county').F):null,land:new Path2D(H.state),
      cells,cols,rows,cs,snap:document.createElement('canvas'),cam:null,settle:0};
  return PC;
}
function ringsOf(it){if(it._rings)return it._rings;const A=L.precinct.A;
  return it._rings=it.r.map(ring=>{const p=[];for(const j of ring){const a=A[j<0?~j:j],n=a.length/2;
    for(let t=p.length?1:0;t<n;t++){const u=j<0?n-1-t:t;p.push(a[2*u],a[2*u+1]);}}return p;});}
function pickPrecinct(sx,sy){
  if(!PC)return null;const x=(sx-S.tx)/S.k,y=(sy-S.ty)/S.k,c=Math.floor(x/PC.cs),r=Math.floor(y/PC.cs);
  if(c<0||r<0||c>=PC.cols||r>=PC.rows)return null;
  const gx=x/H.q,gy=y/H.q,o=L.precinct;
  for(const i of PC.cells[r*PC.cols+c]){const it=o.items[i],b=it.bbox;
    if(x<b[0]||x>b[2]||y<b[1]||y>b[3])continue;let inside=false;
    for(const p of ringsOf(it))for(let a=0,n=p.length,b2=n-2;a<n;b2=a,a+=2){const y0=p[a+1],y1=p[b2+1];
      if((y0>gy)!==(y1>gy)&&gx<p[a]+(gy-y0)*(p[b2]-p[a])/(y1-y0))inside=!inside;}
    if(inside)return it;}
  return null;
}
const DPR=()=>Math.min(2,devicePixelRatio||1);
function sizeCanvas(){const d=DPR(),w=Math.round(S.vw*d),h=Math.round(S.vh*d);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;if(PC)PC.cam=null;}}
function renderCrisp(){
  const d=DPR(),mx=Math.round(cv.width*.25),my=Math.round(cv.height*.25),sn=PC.snap;
  if(sn.width!==cv.width+2*mx||sn.height!==cv.height+2*my){sn.width=cv.width+2*mx;sn.height=cv.height+2*my;}
  const c=sn.getContext('2d'),css=getComputedStyle(document.documentElement),v=n=>css.getPropertyValue(n).trim();
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,sn.width,sn.height);
  const ox=mx+d*S.tx,oy=my+d*S.ty;
  c.setTransform(d*S.k,0,0,d*S.k,ox,oy);c.fillStyle=v('--land');c.fill(PC.land);
  const s=d*S.k*H.q;c.setTransform(s,0,0,s,ox,oy);c.lineJoin='round';c.lineCap='round';
  const vx0=(-mx/d-S.tx)/S.k,vy0=(-my/d-S.ty)/S.k,vx1=((sn.width-mx)/d-S.tx)/S.k,vy1=((sn.height-my)/d-S.ty)/S.k;
  c.strokeStyle=v('--hair');c.lineWidth=.7*d/s;
  for(const t of PC.tiles){const b=t.bb;if(b[2]<vx0||b[0]>vx1||b[3]<vy0||b[1]>vy1)continue;c.stroke(t.p);}
  if(PC.cty){c.strokeStyle=v('--ink-2');c.lineWidth=1.1*d/s;c.stroke(PC.cty);}
  PC.cam={k:S.k,tx:S.tx,ty:S.ty,mx,my};
  cv.dataset.shapes=L.precinct.items.length;
}
function blit(){const d=DPR(),C=PC.cam,r=S.k/C.k;cvx.setTransform(1,0,0,1,0,0);cvx.clearRect(0,0,cv.width,cv.height);
  cvx.setTransform(r,0,0,r,d*S.tx-r*(C.mx+d*C.tx),d*S.ty-r*(C.my+d*C.ty));cvx.drawImage(PC.snap,0,0);}
function paint(moving){
  if(S.layer!=='precinct'||!PC)return;sizeCanvas();
  const C=PC.cam;
  if(!C||!moving){renderCrisp();blit();return;}
  /* moving: only re-position the bitmap (soft when zoomed far in); crisp once settled.
     A mid-gesture re-render was measured to double the worst frame, so there is none. */
  blit();clearTimeout(PC.settle);PC.settle=setTimeout(()=>{renderCrisp();blit();},110);
}
function repaint(){if(PC)PC.cam=null;paint(false);}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',repaint);

/* ---------- layer switching ---------- */
function setLayer(key,keepSel){
  if(!META[key])key=H.layers[0].key;
  if(S.layer&&L[S.layer]&&L[S.layer].g){L[S.layer].g.style.display='none';L[S.layer].g.classList.remove('live');}
  S.layer=key;const onCanvas=key==='precinct';
  cv.style.display=onCanvas?'block':'none';$('land').style.display=onCanvas?'none':'';
  if(onCanvas){prepCanvas();paint(!!PC.cam);}   /* pre-rendered in idle time: show it now, sharpen on settle */
  else{const o=build(key);o.g.style.display='';o.g.classList.add('live');}
  if(META.county){const c=ctxLines();c.style.display=(key==='county'||onCanvas)?'none':'';}
  document.querySelectorAll('#layers input').forEach(r=>{r.checked=r.value===key;
    if(r.checked&&S.vw<=760)r.parentNode.scrollIntoView({inline:'nearest',block:'nearest'});});
  if(!keepSel)closePanel(true);
  hoverOff();scheduleLabels(true);writeHash();
}
document.querySelectorAll('#layers input').forEach(r=>r.addEventListener('change',()=>setLayer(r.value)));

/* ---------- camera: screen px; canvas units scale by k ---------- */
function measure(){const r=svg.getBoundingClientRect();S.vw=r.width;S.vh=r.height;
  const side=$('side').getBoundingClientRect(),narrow=S.vw<=760;
  /* fit inside the area not covered by the side card */
  S.pad=narrow?{l:12,r:12,t:side.bottom+8,b:70}:{l:side.right+16,r:72,t:24,b:24};
  const aw=S.vw-S.pad.l-S.pad.r,ah=S.vh-S.pad.t-S.pad.b,hb=H.home;
  S.fullK=Math.min(aw/H.w,ah/H.h);                                   /* whole canvas */
  S.fitK=Math.min(aw/(hb[2]-hb[0]),ah/(hb[3]-hb[1]));}               /* home view */
function apply(){const tr='translate('+S.tx.toFixed(2)+' '+S.ty.toFixed(2)+') scale('+S.k.toFixed(5)+')';
  cam.setAttribute('transform',tr);labG.setAttribute('transform',tr);sizeLabels();paint(true);}
function sizeLabels(){for(const t of labG.children){t.setAttribute('font-size',(t._px/S.k).toFixed(3));
  t.setAttribute('stroke-width',(t._hw/S.k).toFixed(3));}}
let raf=0;function setCam(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;apply();});scheduleLabels();}
const KMAX=()=>S.fitK*80,KMIN=()=>Math.min(S.fitK,S.fullK)*.7;   /* can always zoom out past the whole state */
function fitAll(){measure();const hb=H.home;S.k=S.fitK;
  S.tx=S.pad.l+(S.vw-S.pad.l-S.pad.r-(hb[2]-hb[0])*S.k)/2-hb[0]*S.k;
  S.ty=S.pad.t+(S.vh-S.pad.t-S.pad.b-(hb[3]-hb[1])*S.k)/2-hb[1]*S.k;setCam();}
function fitBox(b,anim){
  const w=b[2]-b[0],h=b[3]-b[1];
  if(!(isFinite(w)&&isFinite(h))||w<0||h<0)return;      /* Zerobox */
  const aw=S.vw-S.pad.l-S.pad.r-(panel.classList.contains('on')&&S.vw>760?336:0),
        ah=S.vh-S.pad.t-S.pad.b-(S.vw<=760&&panel.classList.contains('on')?S.vh*.5:0);
  const k=Math.max(KMIN(),Math.min(KMAX(),Math.min(aw/Math.max(w,1)/1.25,ah/Math.max(h,1)/1.25)));
  const tx=S.pad.l+aw/2-k*(b[0]+w/2),ty=S.pad.t+ah/2-k*(b[1]+h/2);
  if(anim===false||matchMedia('(prefers-reduced-motion:reduce)').matches){S.k=k;S.tx=tx;S.ty=ty;setCam();return;}
  const k0=S.k,x0=S.tx,y0=S.ty,t0=performance.now(),D=420;
  const step=now=>{let t=Math.min(1,(now-t0)/D);t=1-Math.pow(1-t,4);
    S.k=k0*Math.pow(k/k0,t);S.tx=x0+(tx-x0)*t;S.ty=y0+(ty-y0)*t;apply();
    if(t<1)requestAnimationFrame(step);else scheduleLabels();};
  requestAnimationFrame(step);
}
function zoomAt(f,cx,cy){const k2=Math.min(KMAX(),Math.max(KMIN(),S.k*f)),r=k2/S.k;
  S.tx=cx-r*(cx-S.tx);S.ty=cy-r*(cy-S.ty);S.k=k2;setCam();}
function pt(ev){const r=svg.getBoundingClientRect();return[ev.clientX-r.left,ev.clientY-r.top];}
$('zin').onclick=()=>zoomAt(1.6,S.vw/2,S.vh/2);
$('zout').onclick=()=>zoomAt(1/1.6,S.vw/2,S.vh/2);
$('zfit').onclick=()=>fitAll();
svg.addEventListener('wheel',ev=>{ev.preventDefault();const[x,y]=pt(ev);
  zoomAt(Math.pow(1.0018,-ev.deltaY*(ev.deltaMode?33:1)),x,y);hint();},{passive:false});
svg.addEventListener('dblclick',ev=>{const[x,y]=pt(ev);zoomAt(ev.shiftKey?1/2:2,x,y);});
addEventListener('resize',()=>{const k=S.k/S.fitK,cx=(S.vw/2-S.tx)/S.k,cy=(S.vh/2-S.ty)/S.k;measure();
  S.k=S.fitK*k;S.tx=S.vw/2-cx*S.k;S.ty=S.vh/2-cy*S.k;setCam();});

/* ---------- pointer: pan, pinch, click resolved from the POINTERDOWN target (Deadclick) ---------- */
const P=new Map();let down=null,pinch=null;
svg.addEventListener('pointerdown',ev=>{
  P.set(ev.pointerId,pt(ev));svg.setPointerCapture(ev.pointerId);
  if(P.size===1)down={x:ev.clientX,y:ev.clientY,p:pt(ev),t:ev.target,moved:false,id:ev.pointerId};
  if(P.size===2){const[a,b]=[...P.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),m:[(a[0]+b[0])/2,(a[1]+b[1])/2]};if(down)down.moved=true;}
});
svg.addEventListener('pointermove',ev=>{
  if(P.has(ev.pointerId)){
    const prev=P.get(ev.pointerId),cur=pt(ev);P.set(ev.pointerId,cur);
    if(pinch&&P.size===2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      S.tx+=m[0]-pinch.m[0];S.ty+=m[1]-pinch.m[1];zoomAt(d/pinch.d,m[0],m[1]);pinch={d,m};return;}
    if(down&&!down.moved&&Math.hypot(ev.clientX-down.x,ev.clientY-down.y)<5)return;
    if(down){down.moved=true;svg.classList.add('panning');hoverOff();}
    S.tx+=cur[0]-prev[0];S.ty+=cur[1]-prev[1];setCam();hint();return;
  }
  if(ev.pointerType==='mouse')hover(ev);
});
function endPtr(ev,cancel){
  P.delete(ev.pointerId);if(P.size<2)pinch=null;
  if(P.size===0){svg.classList.remove('panning');
    if(!cancel&&down&&!down.moved){const it=itemAt(down.t,down.p);if(it)select(it,false);else closePanel();}
    down=null;}
}
svg.addEventListener('pointerup',ev=>endPtr(ev,false));
svg.addEventListener('pointercancel',ev=>endPtr(ev,true));
svg.addEventListener('pointerleave',hoverOff);
svg.addEventListener('keydown',ev=>{const s=60,m={ArrowLeft:[s,0],ArrowRight:[-s,0],ArrowUp:[0,s],ArrowDown:[0,-s]}[ev.key];
  if(m){ev.preventDefault();S.tx+=m[0];S.ty+=m[1];setCam();}
  else if(ev.key==='+'||ev.key==='='){zoomAt(1.6,S.vw/2,S.vh/2);}
  else if(ev.key==='-'||ev.key==='_'){zoomAt(1/1.6,S.vw/2,S.vh/2);}
  else if(ev.key==='0'){fitAll();}});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){if($('sources').classList.contains('on'))toggleSources(false);else closePanel();}
  if(ev.key==='/'&&document.activeElement!==$('q')){ev.preventDefault();$('q').focus();}});

/* ---------- hover ---------- */
let hovI=null;
/* the shape under a pointer: the SVG target for SVG layers, the canvas hit-test for precincts */
function itemAt(t,p){
  if(S.layer==='precinct')return pickPrecinct(p[0],p[1]);
  const o=L[S.layer];return t&&t.dataset&&t.dataset.i!==undefined&&t.parentNode===o.g?o.items[+t.dataset.i]:null;
}
function hover(ev){
  const it=itemAt(ev.target,pt(ev));
  svg.style.cursor=it?'pointer':'';
  if(!it){hoverOff();return;}
  if(it!==hovI){hovI=it;$('hov').setAttribute('d',it.d);$('hov').setAttribute('transform','scale('+H.q+')');
    tip.innerHTML='<b></b><div class="t2"></div>';tip.firstChild.textContent=it.label;tip.lastChild.textContent=subline(it);}
  tip.style.display='block';
  const x=Math.min(ev.clientX+14,innerWidth-tip.offsetWidth-8),y=Math.min(ev.clientY+16,innerHeight-tip.offsetHeight-8);
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function hoverOff(){hovI=null;tip.style.display='none';$('hov').setAttribute('d','');}
function subline(it){
  const x=it.x||{},parts=[];
  if(it.layer==='precinct'){if(x.county&&x.county.length)parts.push(L.county?nameOf('county',x.county[0]):'');}
  else if(it.layer==='county'){if(x.cd)parts.push(x.cd.length===1?'CD '+num(load('cd').items[x.cd[0]].short):x.cd.length+' congressional districts');}
  else if(x.county)parts.push(x.county.length===1?nameOf('county',x.county[0]):x.county.length+' counties');
  if(it.area)parts.push(sqmi(it.area)+' sq mi');
  return parts.filter(Boolean).join(' · ');
}
function nameOf(k,j){return load(k).items[j].label;}
function num(s){return /^\d+$/.test(s)?String(+s):s;}
function sqmi(m2){const v=m2/2589988.11;return v<10?v.toFixed(1):Math.round(v).toLocaleString();}

/* ---------- selection + inspector ---------- */
function select(it,frame){
  if(it.layer!==S.layer)setLayer(it.layer,true);
  S.sel=it;const tr='scale('+H.q+')';
  for(const id of['sel','selU']){$(id).setAttribute('d',it.d);$(id).setAttribute('transform',tr);}
  $('pname').textContent=it.label;
  $('psub').textContent=it.layer==='precinct'?'Precinct'+(it.x&&it.x.county&&it.x.county.length&&META.county?' in '+nameOf('county',it.x.county[0]):''):'';
  const dl=$('pfacts');dl.textContent='';
  const add=(t,node)=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=t;
    if(typeof node==='string')dd.textContent=node;else dd.appendChild(node);dl.append(dt,dd);};
  if(it.area)add('Land area',sqmi(it.area)+' sq mi');
  if(it.np!=null&&META.precinct)add('Precincts',it.np.toLocaleString());
  const x=it.x||{};
  for(const l of H.layers){if(l.key===it.layer||!x[l.key])continue;
    const js=x[l.key];if(!js.length)continue;
    add(js.length===1?l.noun.replace(/^State /,''):l.tab,chips(l.key,js));}
  if(it.code)add('Precinct code',it.code);
  panel.classList.add('on');document.body.classList.add('sheet');
  if(frame!==false)fitBox(it.bbox);
  writeHash();scheduleLabels(true);
}
function chips(key,js){
  const wrap=document.createElement('div');wrap.className='chips';const o=load(key);
  const LIM=14,mk=j=>{const it=o.items[j],b=document.createElement('button');b.className='xchip';b.type='button';
    if(it.col!=null){const s=document.createElement('span');s.className='sw';s.style.background='var(--c'+it.col+')';b.appendChild(s);}
    b.append(DIST[key]?num(it.short):it.short);b.title=it.label;b.onclick=()=>select(it,true);return b;};
  const sorted=js.slice().sort((a,b)=>cmp(o.items[a].short,o.items[b].short));
  sorted.slice(0,LIM).forEach(j=>wrap.appendChild(mk(j)));
  if(sorted.length>LIM){const m=document.createElement('button');m.className='more';m.type='button';
    m.textContent='+'+(sorted.length-LIM)+' more';m.onclick=()=>{m.remove();sorted.slice(LIM).forEach(j=>wrap.appendChild(mk(j)));};wrap.appendChild(m);}
  return wrap;
}
function cmp(a,b){return a.localeCompare(b,undefined,{numeric:true});}
function closePanel(quiet){panel.classList.remove('on');document.body.classList.remove('sheet');S.sel=null;
  $('sel').setAttribute('d','');$('selU').setAttribute('d','');if(!quiet){writeHash();scheduleLabels(true);}}
$('pclose').onclick=()=>closePanel();

/* ---------- labels: placed on settle, only where they fit ---------- */
let lt=0;
function scheduleLabels(now){clearTimeout(lt);lt=setTimeout(placeLabels,now?0:140);}
function placeLabels(){
  labG.textContent='';const o=L[S.layer];if(!o)return;
  /* label size and halo width are skin tokens (a halo can be a full badge) */
  const dist=!!DIST[S.layer],cs=getComputedStyle(document.documentElement),tok=(n,d)=>parseFloat(cs.getPropertyValue(n))||d,
    px=dist?tok('--lbl-n',13):tok('--lbl',12),hw=dist?tok('--halo-n',3):tok('--halo-w',3),out=[],taken=[];
  const vx0=-S.tx/S.k,vy0=-S.ty/S.k,vx1=(S.vw-S.tx)/S.k,vy1=(S.vh-S.ty)/S.k;
  const cand=[];
  for(const it of o.items){const b=it.bbox;if(b[2]<vx0||b[0]>vx1||b[3]<vy0||b[1]>vy1)continue;
    const c=it.c;if(c[0]<vx0||c[0]>vx1||c[1]<vy0||c[1]>vy1)continue;
    const txt=dist?num(it.short):it.short,wpx=txt.length*px*.6+6,bw=(b[2]-b[0])*S.k,bh=(b[3]-b[1])*S.k;
    if(bw<wpx*1.1||bh<px*1.6)continue;cand.push([bw*bh,it,txt,wpx]);}
  cand.sort((a,b)=>b[0]-a[0]);
  for(const[,it,txt,wpx]of cand){if(out.length>=220)break;
    const sx=it.c[0]*S.k+S.tx,sy=it.c[1]*S.k+S.ty,r=[sx-wpx/2,sy-px*.7,sx+wpx/2,sy+px*.7];
    if(taken.some(t=>r[0]<t[2]&&r[2]>t[0]&&r[1]<t[3]&&r[3]>t[1]))continue;taken.push(r);
    const t=el('text',{x:it.c[0],y:it.c[1],class:dist?'lbl n':'lbl'});t._px=px;t._hw=hw;t.textContent=txt;out.push(t);}
  const f=document.createDocumentFragment();out.forEach(t=>f.appendChild(t));labG.appendChild(f);sizeLabels();
}

/* ---------- search across every layer ---------- */
const q=$('q'),res=$('results');let hits=[],cur=-1,index=null;
function buildIndex(){index=[];for(const l of H.layers){const o=load(l.key);
  for(const it of o.items){const extra=DIST[l.key]?[l.tab+' '+num(it.short),abbr(l.key)+' '+num(it.short),abbr(l.key)+num(it.short)]:[];
    index.push([norm([it.label,it.short,...extra].join(' | ')),it]);}}}
function abbr(k){return{cd:'CD',sldu:'SD',sldl:'HD'}[k]||'';}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function search(){
  const v=norm(q.value.trim());if(!v){res.classList.remove('on');q.setAttribute('aria-expanded','false');return;}
  if(!index)buildIndex();
  const terms=v.split(/\s+/),sc=[];
  for(const[s,it]of index){if(!terms.every(t=>s.includes(t)))continue;
    let score=s.startsWith(v)?0:(s.includes(' '+terms[0])||s.startsWith(terms[0]))?1:2;
    score+=it.layer==='precinct'?.5:0;sc.push([score,it]);if(sc.length>4000)break;}
  sc.sort((a,b)=>a[0]-b[0]||cmp(a[1].label,b[1].label));hits=sc.slice(0,40).map(s=>s[1]);cur=hits.length?0:-1;
  res.textContent='';
  if(!hits.length){const li=document.createElement('li');li.className='empty';li.textContent='No match. Try a county name, “HD 12” or “CD 5”.';res.appendChild(li);}
  hits.forEach((it,i)=>{const li=document.createElement('li');li.setAttribute('role','option');li.id='r'+i;
    const a=document.createElement('span');a.textContent=it.label;const k=document.createElement('span');k.className='k';
    k.textContent=it.layer==='precinct'&&it.x&&it.x.county?nameOf('county',it.x.county[0]):META[it.layer].tab;
    li.append(a,k);li.onpointerdown=e=>{e.preventDefault();pick(i);};res.appendChild(li);});
  res.classList.add('on');q.setAttribute('aria-expanded','true');mark();
}
function mark(){[...res.children].forEach((li,i)=>li.setAttribute('aria-selected',String(i===cur)));
  if(cur>=0){q.setAttribute('aria-activedescendant','r'+cur);res.children[cur].scrollIntoView({block:'nearest'});}else q.removeAttribute('aria-activedescendant');}
function pick(i){const it=hits[i];if(!it)return;res.classList.remove('on');q.setAttribute('aria-expanded','false');q.value=it.label;q.blur();select(it,true);}
q.addEventListener('input',search);
q.addEventListener('focus',()=>{if(q.value)search();});
q.addEventListener('blur',()=>setTimeout(()=>{res.classList.remove('on');q.setAttribute('aria-expanded','false');},120));
q.addEventListener('keydown',ev=>{
  if(ev.key==='ArrowDown'){ev.preventDefault();if(hits.length){cur=(cur+1)%hits.length;mark();}}
  else if(ev.key==='ArrowUp'){ev.preventDefault();if(hits.length){cur=(cur-1+hits.length)%hits.length;mark();}}
  else if(ev.key==='Enter'){ev.preventDefault();if(cur>=0)pick(cur);}
  else if(ev.key==='Escape'){q.value='';search();}});

/* ---------- sources, theme, hint, hash ---------- */
const sl=$('srclist');
for(const l of H.layers){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=l.tab;
  dd.textContent=l.source+(l.vintage?' · '+l.vintage:'');if(l.note){const w=document.createElement('div');w.className='warn';w.textContent=l.note;dd.appendChild(w);}sl.append(dt,dd);}
function toggleSources(on){$('sources').classList.toggle('on',on);$('srcbtn').setAttribute('aria-expanded',String(on));}
$('srcbtn').onclick=()=>toggleSources(!$('sources').classList.contains('on'));
/* light by default: the page is read in daylight, in offices and in the field.
   The button cycles light, dark, match system; the choice is remembered. */
const TH={auto:'match system',light:'light',dark:'dark'},NEXT={light:'dark',dark:'auto',auto:'light'};
function setTheme(t,save){S.theme=t;
  if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;
  $('theme').setAttribute('aria-label','Theme: '+TH[t]);$('theme').title='Theme: '+TH[t];
  if(save)try{localStorage.setItem('theme',t);}catch(e){}repaint();if(S.layer)scheduleLabels(true);}
$('theme').onclick=()=>setTheme(NEXT[S.theme],true);
let saved=null;try{saved=localStorage.getItem('theme');}catch(e){}
setTheme(TH[saved]?saved:'light',false);
let hinted=false;function hint(){if(!hinted){hinted=true;$('hint').style.opacity=0;}}
function writeHash(){const h='#'+S.layer+(S.sel?'/'+encodeURIComponent(S.sel.id):'');
  if(location.hash!==h)history.replaceState(null,'',h);}
function readHash(){const m=decodeURIComponent(location.hash.slice(1)).split('/'),key=META[m[0]]?m[0]:(META.cd?'cd':H.layers[0].key);
  setLayer(key);if(m[1]){const it=load(key).byId.get(m.slice(1).join('/'));if(it)select(it,true);}}
addEventListener('hashchange',readHash);

/* ---------- O3: prepare every layer in idle time, so the first switch is instant ---------- */
function warm(){
  const idle=window.requestIdleCallback||(f=>setTimeout(()=>f({timeRemaining:()=>10,didTimeout:false}),60));
  const jobs=[];
  for(const l of H.layers){if(l.key==='precinct')jobs.push(()=>load('precinct'),()=>prepCanvas(),
      ()=>{if(!PC.cam){sizeCanvas();renderCrisp();}},()=>L.precinct.items.forEach(ringsOf));
    else jobs.push(()=>build(l.key));}
  if(META.county)jobs.push(()=>ctxLines());
  jobs.push(()=>{if(!index)buildIndex();});
  const run=dl=>{do{jobs.shift()();}while(jobs.length&&dl.timeRemaining()>6);if(jobs.length)idle(run,{timeout:1500});};
  idle(run,{timeout:1500});
}

fitAll();readHash();
requestAnimationFrame(()=>setTimeout(warm,250));
/* web fonts change the side card's size after first layout: redo the fit (unless the
   reader has already moved or picked something) and keep the chosen chip in view */
if(document.fonts)document.fonts.ready.then(()=>{
  if(!hinted&&!S.sel)fitAll();else measure();
  const c=document.querySelector('#layers input:checked');
  if(c&&S.vw<=760)c.parentNode.scrollIntoView({inline:'nearest',block:'nearest'});
  scheduleLabels(true);});
})();
</script>
</body></html>
